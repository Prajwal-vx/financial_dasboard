<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | FinSight</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom)); background: #071b22; color: #ebf5f6; font: 1rem/1.55 "Segoe UI", sans-serif; }
      main { width: min(100%, 32rem); padding: clamp(1.25rem, 5vw, 2.25rem); border: 1px solid #31545d; border-radius: 1rem; background: #0f1d23; }
      h1 { line-height: 1.15; letter-spacing: -.03em; }
      label, input, button { display: block; width: 100%; margin: .8rem 0; }
      input, button { min-height: 48px; padding: .8rem; border-radius: .5rem; font: inherit; }
      input { color: #102b32; }
      button { cursor: pointer; background: #e49a2b; border: 0; color: #102b32; font-weight: 700; }
      :where(input, button, a):focus-visible { outline: 3px solid #73efdc; outline-offset: 3px; }
      main > a { color: #73efdc; }
      #message { min-height: 1.5rem; }
      @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose a new password</h1>
      <p>Use at least 12 characters. Your password will also be checked against known breaches.</p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        <button type="submit">Update password</button>
      </form>
      <p id="message" role="status"></p>
      <a href="/login">Return to sign in</a>
    </main>
    <script src="/reset-password.js" defer></script>
  </body>
</html>
