<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset password | FinSight</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #061b22; color: #ebf5f6; font: 1rem "Segoe UI", sans-serif; }
      main { width: min(100% - 2rem, 32rem); padding: 2rem; border: 1px solid #31545d; border-radius: 1rem; background: #0f1d23; }
      label, input, button { display: block; width: 100%; margin: .8rem 0; }
      input, button { box-sizing: border-box; padding: .8rem; border-radius: .5rem; }
      button { cursor: pointer; }
      #message { min-height: 1.5rem; }
    </style>
  </head>
  <body>
    <main>
      <h1>Choose a new password</h1>
      <p>Use at least 12 characters. Your password will also be checked against known breaches.</p>
      <form id="reset-form">
        <label for="password">New password</label>
        <input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
        <button type="submit">Update password</button>
      </form>
      <p id="message" role="status"></p>
      <a href="/login">Return to sign in</a>
    </main>
    <script src="/reset-password.js" defer></script>
  </body>
</html>
